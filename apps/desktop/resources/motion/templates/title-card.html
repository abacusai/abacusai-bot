<style>
  .tc-ring {
    position: absolute; z-index: 0; left: 50%; top: 50%;
    width: calc(var(--u) * 92); height: calc(var(--u) * 92); margin: calc(var(--u) * -46) 0 0 calc(var(--u) * -46);
    border-radius: 50%; border: calc(var(--u) * .3) solid color-mix(in srgb, var(--accent) 30%, transparent);
    animation: tc-ring var(--total) var(--ease-out) both;
  }
  .tc-ring.r2 { width: calc(var(--u) * 130); height: calc(var(--u) * 130); margin: calc(var(--u) * -65) 0 0 calc(var(--u) * -65); border-color: color-mix(in srgb, var(--accent2) 16%, transparent); animation-duration: calc(var(--total) * 1.3); }
  @keyframes tc-ring { from { opacity: 0; transform: scale(.7); } 20% { opacity: 1; } to { opacity: 1; transform: scale(1.08); } }
  .tc-stage .pill { font-size: calc(var(--u) * 3.4); }
  .tc-title { font-size: calc(var(--u) * var(--t-display)); font-weight: 850; line-height: 1.02; letter-spacing: -.035em; max-height: calc(var(--u) * 50); }
  .tc-sub { font-size: calc(var(--u) * var(--t-h3)); font-weight: 450; line-height: 1.3; opacity: .82; max-width: calc(var(--u) * 140); max-height: calc(var(--u) * 24); }
  .size-9x16 .tc-title { max-height: calc(var(--u) * 90); }
  .size-9x16 .tc-sub { max-height: calc(var(--u) * 40); }
</style>
<div class="stage tc-stage">
  <div class="tc-ring"></div><div class="tc-ring r2"></div>
  {{#kicker}}<div class="pill pop" dir="auto" style="--d:.2s" data-fit>{{kicker}}</div>{{/kicker}}
  <h1 class="tc-title" dir="auto" data-fit>{{#titleWords}}<span class="word"><span style="--wd:{{wd}}s">{{w}}</span></span> {{/titleWords}}</h1>
  <div class="rule wipe" style="--d:{{lineAt}}s"></div>
  {{#subtitle}}<p class="tc-sub rise" dir="auto" style="--d:{{subtitleAt}}s" data-fit>{{subtitle}}</p>{{/subtitle}}
</div>
