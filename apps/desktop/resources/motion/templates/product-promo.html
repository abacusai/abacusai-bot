<style>
  .pp-mark { font-size: calc(var(--u) * 16); font-weight: 900; letter-spacing: -.045em; line-height: .95; max-height: calc(var(--u) * 44); padding-bottom: .06em; }
  .pp-tagline { font-size: calc(var(--u) * var(--t-h1)); font-weight: 800; line-height: 1.08; letter-spacing: -.03em; max-height: calc(var(--u) * 52); }
  /* The features: a checklist that builds up, one item every 1.4 s. */
  .pp-list { list-style: none; display: flex; flex-direction: column; gap: calc(var(--u) * 3); align-items: stretch; width: min(100%, calc(var(--u) * 150)); text-align: start; }
  .pp-item {
    display: flex; align-items: center; gap: calc(var(--u) * 3.2);
    padding: calc(var(--u) * 2.6) calc(var(--u) * 3.4); border-radius: calc(var(--u) * 2.4);
    background: color-mix(in srgb, var(--ink) 6%, transparent);
    border: calc(var(--u) * .25) solid color-mix(in srgb, var(--ink) 10%, transparent);
    animation: pp-item .7s var(--ease-out) calc(var(--d) + var(--k)) both;
  }
  @keyframes pp-item { from { opacity: 0; transform: translateX(calc(var(--u) * -6)); } to { opacity: 1; transform: none; } }
  .pp-check {
    flex: none; width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 50%;
    display: grid; place-items: center; background: var(--gradient);
    animation: pop .55s var(--ease-back) calc(var(--d) + var(--k) + .2s) both;
  }
  .pp-check svg { width: 58%; height: 58%; }
  .pp-feature { font-size: calc(var(--u) * var(--t-h2) * .82); font-weight: 700; line-height: 1.2; letter-spacing: -.01em; max-height: calc(var(--u) * 16); min-width: 0; }
  .pp-small { font-size: calc(var(--u) * var(--t-h3)); font-weight: 800; letter-spacing: -.02em; opacity: .9; }
  .pp-cta {
    position: relative; overflow: hidden;
    font-size: calc(var(--u) * 6); font-weight: 850; line-height: 1.15; padding: calc(var(--u) * 3) calc(var(--u) * 6.5);
    border-radius: 99px; background: var(--gradient); color: var(--paper); max-height: calc(var(--u) * 40);
    box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 6) color-mix(in srgb, var(--accent) 40%, transparent);
  }
  /* A light sweeping across the button, twice. */
  .pp-cta::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .45) 50%, transparent 65%);
    transform: translateX(-120%); animation: pp-shine 1.2s var(--ease-in-out) calc(var(--d) + 1.1s) 2 both;
  }
  @keyframes pp-shine { to { transform: translateX(120%); } }
  .size-9x16 .pp-mark { font-size: calc(var(--u) * 20); }
  .size-9x16 .pp-tagline { max-height: calc(var(--u) * 90); }
  .size-9x16 .pp-feature { max-height: calc(var(--u) * 26); }
  .size-9x16 .pp-cta { font-size: calc(var(--u) * 7.5); }
  .size-16x9 .pp-list { gap: calc(var(--u) * 2.4); width: min(100%, calc(var(--u) * 130)); }
  .size-16x9 .pp-mark { font-size: calc(var(--u) * 21); }
</style>
<div class="scene" style="--d:0s;--len:2.4s">
  <div class="pp-mark gradient-text pop" dir="auto" style="--k:.1s" data-fit>{{name}}</div>
  <div class="rule wipe" style="--k:.6s"></div>
</div>
<div class="scene" style="--d:2.4s;--len:2.8s">
  <p class="pp-tagline rise" dir="auto" style="--k:.1s" data-fit>{{tagline}}</p>
</div>
<div class="scene" style="--d:5.2s;--len:{{featuresLen}}s">
  <ul class="pp-list">{{#features}}
    <li class="pp-item" style="--k:{{k}}s"><span class="pp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--paper)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="pp-feature" dir="auto" data-fit>{{feature}}</span></li>{{/features}}
  </ul>
</div>
<div class="scene last" style="--d:{{ctaAt}}s">
  <div class="pp-small fade" dir="auto" style="--k:.1s">{{name}}</div>
  <div class="pp-cta pop" dir="auto" style="--k:.35s" data-fit>{{cta}}</div>
</div>
