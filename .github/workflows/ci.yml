name: CI

# This repo builds, it does not release.
#
# Signed and notarized releases are produced by a separate private build repo,
# which pins a commit of this repo and holds the Apple Developer ID and Azure
# Trusted Signing credentials. Nothing here needs a secret, which is the point: a
# pull request from a fork runs the same checks as a push to main, and no
# workflow in this repo can reach a signing key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The renderer bundle (monaco, shiki, katex) no longer fits in Node's default
  # ~2GB old-space during the transform. Without this the build dies with
  # `FATAL ERROR: JavaScript heap out of memory` and exit 134, which names a
  # symptom rather than a cause.
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Which release unit does this change touch? Renderer and agent source are
  # an experience release (hot-swapped over TUF, no relaunch); anything else
  # — dependencies, the shell, the preload, the lockfile — fails toward a
  # full signed foundation release. Informational here; the release pipeline
  # runs the same classifier to decide what a tag needs.
  classify:
    name: Classify release impact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@abacus-ai/updater
      - name: Classify the changed paths
        run: |
          set -euo pipefail
          # No --depth here: the base can gain commits between checkout and
          # this fetch (a merge landing mid-run), and a shallow fetch grafts
          # that tip with no ancestry, so `...` finds no merge base.
          git fetch --no-tags origin "${{ github.base_ref }}"
          result=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD | node apps/updater/dist/classify.mjs)
          kind=$(echo "$result" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).kind))')
          echo "This change is a **${kind}** release." >> "$GITHUB_STEP_SUMMARY"
          echo "$result"

  check:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      # The tool configs (oxlint.config.ts, oxfmt.config.ts and what they
      # import) belong to no workspace package, so `pnpm run typecheck` never
      # sees them — and lint is invoked directly above, not through turbo, so
      # the //#lint task's dependsOn never fires either.
      - run: pnpm run typecheck:tools
      # Covers every workspace package, so a reference to something that does
      # not exist fails here rather than in six platform jobs several minutes
      # later.
      - run: pnpm run typecheck
      - name: i18n and locale guards
        run: |
          pnpm --filter @abacus-ai/desktop run check:i18n
          pnpm --filter @abacus-ai/desktop run check:locales

      # Fails on any high/critical advisory that is not on the documented
      # exception list in the script — each entry names why it is accepted, and
      # goes stale (and fails) the moment the upstream fix ships.
      - name: Audit dependencies
        run: pnpm run check:audit

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      # macOS is not redundant: the sandbox confinement tests skip themselves on
      # a platform with no backend, so on Linux alone the suite would report
      # green while proving nothing about the thing most worth proving — that a
      # write outside the workspace is actually refused.
      #
      # Windows is here because faking `process.platform` in a unit test cannot
      # reach the things that actually break there: cmd.exe quoting, whether
      # taskkill exists, how PATHEXT resolves an extensionless command.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows blocks like everywhere else. It reported without blocking while
    # the desktop suite was failing there, which is exactly how it came to be
    # failing on main without anyone noticing — a job nobody has to look at is
    # a job nobody looks at.
    #
    # Two agent-side bugs are still open, with their tests skipped and the
    # reason named at each skip: the scratch carve-out in
    # extensions/guardrails.ts matches the temp dir in short form against a
    # long-form real path, and backends.ts terminate() has no process-tree kill
    # on Windows, so a stopped command leaks its descendants. Skipped is the
    # right shape for those — they name themselves, and they do not hide a
    # regression in everything else.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # E2E tests execute the built CLI and bundled-tools tests execute the
      # vendored search binaries. A clean runner has neither until the complete
      # build graph has run — fetching the binaries alone leaves the suites that
      # spawn the CLI failing on a bundle that was never built.
      - name: Build what the tests execute
        run: pnpm run build

      - run: pnpm run test

      # The agent resolves these at runtime rather than shelling out to whatever
      # is on PATH, so a vendor step that half-succeeded is a search tool that
      # does not exist — on one platform only, which is how it stays unnoticed.
      - name: The search binaries landed beside the agent and run
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"
          "packages/agent/vendor/rg${suffix}" --version
          "packages/agent/vendor/fd${suffix}" --version

      # The desktop app spawns the agent and speaks NDJSON to it. This asserts
      # the host still answers on stdout in the protocol, whatever it has to
      # say — a stack trace on stderr and silence on stdout is a dead app.
      - name: The desktop entry still speaks NDJSON
        shell: bash
        run: |
          set -uo pipefail
          export ABACUSAI_BOT_HOME="$RUNNER_TEMP/abacusai-bot-empty"
          output=$(echo '{"type":"send","message":"hi"}' | node packages/agent/dist/main.js 2>/dev/null | head -20)

          echo "$output"
          echo "$output" | node -e '
            let raw = ""
            process.stdin.on("data", chunk => { raw += chunk })
            process.stdin.on("end", () => {
              const events = raw.split("\n").filter(Boolean).map(line => JSON.parse(line))
              if (events.length === 0) throw new Error("the agent emitted no protocol events")
              if (!events.some(event => typeof event.type === "string")) throw new Error("events carry no type")
            })
          '

  package:
    name: Package (${{ matrix.os }})
    needs: [check]
    strategy:
      # A failure on one platform should not hide a passing build on the others.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build every workspace dependency and fetch every vendored runtime before
      # electron-builder walks dist/ and extraResources. Calling package:dir on
      # its own does neither and produces an asar with no main entry.
      - run: pnpm run build

      - name: Package unpacked app
        env:
          # Without this, electron-builder picks up whatever identity happens to
          # be in the runner keychain and fails confusingly. Unsigned is the
          # correct outcome for a build from this repo.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @abacus-ai/desktop run package:dir

      # A build that succeeds can still ship an app that cannot run what it
      # spawns: electron-builder drops a nested node_modules without a word.
      # Nothing before this step looks inside the packaged app.
      - name: Check the packaged app has what it spawns
        run: pnpm --filter @abacus-ai/desktop run check:packaged

      # Nothing else starts the app. Typecheck and the unit suites never load
      # main/index.ts, so the failures this shape produces — a named import from
      # a CommonJS package, `__dirname` in an ESM main process, a module that is
      # not inside the asar — get through green CI and only appear on launch.
      #
      # The app has to SAY it started. This used to watch the pid for thirty
      # seconds and pass if the process was still there, which is not the same
      # question: an uncaught exception at import time puts up Electron's
      # "A JavaScript error occurred in the main process" dialog and then waits
      # on it, so a crashed app holds its pid open indefinitely and looked
      # exactly like a healthy one. That is how 1.0.6 shipped a main process
      # that could not resolve @earendil-works/pi-tui, through this step, green.
      #
      # So the app prints a marker at the end of its ready chain — every module
      # evaluated, window created, IPC registered — and exits 0. No marker, no
      # pass, however alive the process looks.
      - name: The packaged app actually starts
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            Linux) app=$(find release -path '*/linux-unpacked/abacusai-bot' -type f -print -quit) ;;
            macOS) app=$(find release -path '*/Contents/MacOS/*' -type f -print -quit) ;;
            Windows) app=$(find release -path '*/win-unpacked/AbacusBot.exe' -type f -print -quit) ;;
            *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac

          [ -n "$app" ] || { echo "::error::could not find the unpacked app executable"; exit 1; }
          echo "Launching $app"

          # Chromium's setuid sandbox refuses to run — and aborts the whole
          # process — unless its helper is root-owned and setuid. electron-builder
          # cannot set that when it unpacks as the runner user; the installers it
          # produces do it at install time. Do the same here rather than passing
          # --no-sandbox, so the smoke test starts the app the way a user's
          # install does.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sandbox="$(dirname "$app")/chrome-sandbox"
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi

          launch() { if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$@"; else "$@"; fi; }

          # ABACUSAI_BOT_SMOKE_TEST makes the app print the marker and exit 0 once
          # it is fully up. The timeout is the backstop for an app that hangs
          # before that point rather than crashing — also a failure to start.
          ABACUSAI_BOT_SMOKE_TEST=1 launch "$app" > app.log 2>&1 &
          pid=$!

          ready=""
          for _ in $(seq 1 60); do
            if grep -qF '[smoke] main process ready' app.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          cat app.log

          if [ -z "$ready" ]; then
            echo "::error::the packaged app never reported that it started — see the log above"
            exit 1
          fi

          # Belt and braces: the marker says the ready chain finished, this says
          # nothing blew up on the way. ERR_MODULE_NOT_FOUND and Electron's own
          # fatal-dialog text are in the list because they were not, and 1.0.6
          # went out.
          if grep -qiE 'ReferenceError|TypeError|SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find (package|module)|Uncaught Exception|A JavaScript error occurred|threw an error|unhandled (promise )?rejection' app.log; then
            echo "::error::the main process logged a fatal error on startup"
            exit 1
          fi
