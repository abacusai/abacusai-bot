name: CI

# This repo builds, it does not release.
#
# Signed and notarized releases are produced by a separate private build repo,
# which pins a commit of this repo and holds the Apple Developer ID and Azure
# Trusted Signing credentials. Nothing here needs a secret, which is the point: a
# pull request from a fork runs the same checks as a push to main, and no
# workflow in this repo can reach a signing key.
#
# A pull request runs what its diff reaches (scripts/ci-plan.mjs); a push to
# main runs everything.

on:
  push:
    branches: [main]
  pull_request:
    # `closed` only takes the concurrency group, which cancels a run still
    # going for a pull request that has merged; no job runs on it.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to check
        type: choice
        options: [all, linux]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep the existing heap cap until a final-build peak measurement is available.
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: 1
  ABACUS_BUILD_COMMIT: ${{ github.sha }}

jobs:
  # What this run has to test, and which release unit the change touches.
  # Renderer and agent source are an experience release (hot-swapped over TUF,
  # no relaunch); anything else fails toward a full signed foundation release.
  # A pull request packages on every operating system only when it is a
  # foundation change that touches what the packaged app is built from.
  plan:
    name: Plan
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      any: ${{ steps.plan.outputs.any }}
      agent: ${{ steps.plan.outputs.agent }}
      desktop: ${{ steps.plan.outputs.desktop }}
      systems: ${{ steps.plan.outputs.systems }}
      migrations: ${{ steps.plan.outputs.migrations }}
      package: ${{ steps.classify.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: node scripts/ci-plan.mjs
      - id: classify
        name: Classify release impact
        run: |
          set -euo pipefail
          everywhere='package=["ubuntu-latest","macos-latest","windows-latest"]'
          if [ "${{ inputs.platforms }}" = linux ]; then
            echo 'package=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "$everywhere" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec turbo run build --filter=@abacus-ai/updater
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          result=$(echo "$changed" | node apps/updater/dist/classify.mjs)
          kind=$(echo "$result" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).kind))')
          echo "This change is a **${kind}** release." >> "$GITHUB_STEP_SUMMARY"
          echo "$result"
          packaging='^(\.github/workflows/ci\.yml|\.nvmrc|package\.json|pnpm-(lock|workspace)\.yaml|patches/|packages/config/|packages/agent/(package\.json|tsdown\.config\.ts|scripts/|assets/)|apps/desktop/(package\.json|vite\.config\.ts|electron-builder\.yml|build/|resources/|scripts/|src/main/resources\.ts))'
          if [ "$kind" != experience ] && grep -qE "$packaging" <<< "$changed"; then
            echo "$everywhere" >> "$GITHUB_OUTPUT"
          else
            echo 'package=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Typecheck, lint and format
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The readers below run side by side; the route trees they read are
      # settled first so none sees a build rewriting one.
      - run: pnpm --filter @abacus-ai/web run generate:routes
      - parallel:
          - name: Format
            run: pnpm run format:check
          - name: Lint
            run: pnpm run lint
          # The tool configs belong to no workspace package, so the
          # workspace typecheck never sees them.
          - name: Tool configs typecheck
            run: pnpm run typecheck:tools
          - name: Unused files, exports and dependencies
            run: pnpm run check:knip
          - name: Script tests
            run: pnpm run check:scripts
          - name: i18n and locale guards
            run: |
              pnpm --filter @abacus-ai/web run check:i18n
              pnpm --filter @abacus-ai/web run check:locales
          - name: UI registry
            run: pnpm --filter @abacus-ai/desktop run check:ui-registry
          # Fails on any high/critical advisory that is not on the documented
          # exception list in the script.
          - name: Audit dependencies
            run: pnpm run check:audit
          # Typecheck covers every workspace package. The bundle guard compares
          # the browser graph with the Electron renderer's, so both builds have
          # to exist, and the desktop build reads Chromium's notices from the
          # Electron binary, which Electron 44 fetches on first require.
          - name: Typecheck, builds and the browser bundle guard
            run: |
              set -euo pipefail
              (cd apps/desktop && node -e 'require("electron")')
              pnpm run typecheck
              pnpm exec turbo run build --filter=@abacus-ai/desktop --filter=@abacus-ai/web
              node scripts/check-web-bundle.mjs
              pnpm run check:licenses
              pnpm --filter @abacus-ai/desktop run generate:notices

  # Linux runs every suite the plan picked, each as its own job.
  test:
    name: Tests (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      # A failure ends the run's other suites: the fix is a new push anyway.
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # E2E tests execute the built CLI and bundled-tools tests execute the
      # vendored search binaries, so each suite builds its package's graph
      # first. Electron 44 installs on first require; the desktop build reads
      # Chromium's notices from it, and parallel test workers would race
      # extracting it.
      - name: Build what the tests execute
        run: |
          set -euo pipefail
          if [ "${{ matrix.suite }}" = desktop ]; then
            (cd apps/desktop && node -e 'require("electron")')
            sandbox=$(node -p 'require("path").join(require("path").dirname(require.resolve("electron/package.json", { paths: ["apps/desktop"] })), "dist", "chrome-sandbox")')
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi
          ${{ matrix.build }}

      - name: Run tests
        run: xvfb-run -a ${{ matrix.run }}

      # The agent resolves these at runtime rather than shelling out to whatever
      # is on PATH, so a vendor step that half-succeeded is a search tool that
      # does not exist.
      - name: The search binaries landed beside the agent and run
        if: matrix.suite == 'agent'
        run: packages/agent/vendor/rg --version && packages/agent/vendor/fd --version

      # The desktop app spawns the agent and speaks NDJSON to it: the host has
      # to answer on stdout in the protocol, whatever it has to say.
      - name: The agent speaks AG-UI with a compat stream
        if: matrix.suite == 'agent'
        run: node scripts/agui-smoke.mjs

  # macOS and Windows run the agent and the desktop main process, the parts
  # that differ by system. macOS is not redundant: the sandbox confinement
  # tests skip themselves on a platform with no backend, so Linux alone would
  # report green while proving nothing about whether a write outside the
  # workspace is refused. Windows is where cmd.exe quoting, taskkill and
  # PATHEXT actually break, which faking `process.platform` cannot reach.
  # Their runners are scarce, so each system is one job: one install and
  # build, the agent and desktop suites side by side, then the Electron suites
  # with the machine to themselves.
  #
  # Two agent-side bugs are still open, with their tests skipped and the reason
  # named at each skip: the scratch carve-out in extensions/guardrails.ts
  # matches the temp dir in short form against a long-form real path, and
  # backends.ts terminate() has no process-tree kill on Windows.
  system:
    name: Tests (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.systems != '[]'
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build what the tests execute
        run: |
          set -euo pipefail
          (cd apps/desktop && node -e 'require("electron")')
          pnpm run build

      - parallel:
          - name: Agent
            if: needs.plan.outputs.agent == 'true'
            run: pnpm --dir packages/agent exec vitest run
          - name: Desktop main process
            if: needs.plan.outputs.desktop == 'true'
            run: pnpm --dir apps/desktop exec vitest run --project main --project preload

      - name: Desktop Electron suites
        if: needs.plan.outputs.desktop == 'true'
        run: >-
          pnpm --dir apps/desktop exec vitest run --project main-serial ${{ needs.plan.outputs.migrations != 'true' && '--exclude src/main/migrations/runner.crash.test.ts' || '' }}

      - name: The search binaries landed beside the agent and run
        if: needs.plan.outputs.agent == 'true'
        run: |
          set -euo pipefail
          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"
          "packages/agent/vendor/rg${suffix}" --version
          "packages/agent/vendor/fd${suffix}" --version

      - name: The agent speaks AG-UI with a compat stream
        if: needs.plan.outputs.agent == 'true'
        run: node scripts/agui-smoke.mjs

      # The `bash` tool on Windows is the bundled busybox shell, installed and
      # launched by the agent itself (src/posix-shell.ts). Only a Windows
      # machine can run it, so the built bundle installs the payload and runs a
      # pipeline, a heredoc, a quoted path, a failing command, $TMPDIR and the
      # PowerShell call form through the same operations the tool uses. Both
      # builds: the Unicode one the resolver picks here, and the ANSI fallback
      # a Windows before 10 1903 gets.
      - name: The bundled Windows shell installs and runs
        if: runner.os == 'Windows' && needs.plan.outputs.agent == 'true'
        env:
          LOCALAPPDATA: ${{ runner.temp }}/posix-shell-cache
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { existsSync } from "node:fs";
          import { installPosixShell, posixShell, posixShellOperations } from "./packages/agent/dist/index.js";

          const shell = posixShell();
          if (shell == null) throw new Error("the bundled shell did not install");
          if (shell.ansi) throw new Error("the resolver passed over the Unicode build on a current Windows");
          const ansiPayload = "packages/agent/vendor/busybox-ansi.exe";
          const ansi = existsSync(ansiPayload) ? installPosixShell({ payload: ansiPayload, ansi: true }) : undefined;
          if (process.arch === "x64" && ansi == null) throw new Error("the ANSI build did not install");

          for (const [name, candidate] of [["unicode", shell], ["ansi", ansi]]) {
          if (candidate == null) continue;
          console.log(`-- ${name} build`);
          const ops = posixShellOperations(candidate);

          const run = async (command, env) => {
            let output = "";
            const { exitCode } = await ops.exec(command, process.cwd(), {
              onData: (data) => { output += data; },
              env,
            });
            return { exitCode, output: output.trim() };
          };
          const expect = async (command, output, exitCode = 0, env) => {
            const got = await run(command, env);
            if (got.output !== output || got.exitCode !== exitCode)
              throw new Error(`${command}\n  expected ${JSON.stringify({ output, exitCode })}\n  got      ${JSON.stringify(got)}`);
            console.log(`ok: ${command.split("\n")[0]}`);
          };

          await expect("printf 'b\\na\\n' | sort | head -1", "a");
          await expect("cat <<'EOF'\nquotes ' and \" and $HOME\nEOF", "quotes ' and \" and $HOME");
          await expect("false && echo wrong; false || printf recovered", "recovered");
          await expect("mkdir -p 'dir with space' && printf x > 'dir with space/f.txt' && grep -c x 'dir with space/f.txt'", "1");
          await expect("exit 7", "", 7);
          await expect("node -e \"console.log(process.argv[1])\" 'C:/Users/Some One'", "C:/Users/Some One");
          await expect("printf '%s' \"$BB_OVERRIDE_APPLETS\" | cut -c1-1", ";");
          // A desktop launch has no TMPDIR; the shell env supplies the Windows temp dir.
          const noTmpdir = Object.fromEntries(Object.entries(process.env).filter(([k]) => k.toUpperCase() !== "TMPDIR"));
          await expect('cd "$TMPDIR" && echo ok', "ok", 0, noTmpdir);
          await expect('f=$(mktemp) && printf ok > "$f" && cat "$f" && rm "$f"', "ok", 0, noTmpdir);
          // The PowerShell form the system prompt teaches, with a quoted path inside.
          await expect("powershell -NoProfile -Command '$p = \"C:/x y\"; Write-Output $p.Length'", "6");
          }
          JS

  # The renderer's screenshot gate (spec 01 §10.2) in the real Electron
  # window: every route and band, the collapsed, floating, split, compact and
  # full-screen states, axe, and the Linux native-frame probe, which this job
  # requires (ABACUSBOT_REQUIRE_NATIVE_FRAME).
  screenshots:
    name: renderer screenshots (Linux)
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The workspace packages main imports; the script builds the app itself
      # (VITE_UI_GALLERY=1, the fixture tables).
      - run: pnpm exec turbo run build --filter=@abacus-ai/desktop^...

      - name: Chromium's setuid sandbox helper
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          node -e 'require("electron")'
          sandbox=$(node -p 'require("path").join(require("path").dirname(require.resolve("electron/package.json")), "dist", "chrome-sandbox")')
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: Screenshot gate (native-frame probe required)
        working-directory: apps/desktop
        env:
          ABACUSBOT_REQUIRE_NATIVE_FRAME: "1"
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/screenshots.mjs --require-native-frame

  # Linux packages whenever the desktop app is affected. macOS and Windows
  # package every push to main, and a pull request only when the plan job
  # finds a packaging input in its diff.
  package:
    name: Package (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.package) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build every workspace dependency and fetch every vendored runtime before
      # electron-builder walks dist/ and extraResources; package:dir alone does
      # neither and produces an asar with no main entry. Electron 44 fetches its
      # binary on first require, and the desktop build reads Chromium's notices
      # from it.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/desktop && node -e 'require("electron")')
          pnpm run build
      - name: Reject React Compiler bailouts
        run: pnpm --filter @abacus-ai/desktop run check:react-compiler

      - name: Bundle budgets
        run: pnpm --dir apps/desktop run measure:size && pnpm exec size-limit

      - name: Package unpacked app
        env:
          # Use an unsigned package in public CI.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @abacus-ai/desktop run package:dir

      # electron-builder drops a nested node_modules without a word; nothing
      # before this step looks inside the packaged app.
      - name: Check the packaged app has what it spawns
        run: pnpm --filter @abacus-ai/desktop run check:packaged

      # Nothing else starts the app: typecheck and the unit suites never load
      # main/index.ts, so a named import from a CommonJS package, `__dirname`
      # in an ESM main process, or a module outside the asar only shows on
      # launch. The app has to say it started (a crashed app holds its pid open
      # behind Electron's error dialog), so it prints a marker at the end of
      # its ready chain and exits 0.
      - name: The packaged app actually starts
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            Linux) app=$(find release -path '*/linux-unpacked/abacusai-bot' -type f -print -quit) ;;
            macOS) app=$(find release -path '*/Contents/MacOS/*' -type f -print -quit) ;;
            Windows) app=$(find release -path '*/win-unpacked/AbacusBot.exe' -type f -print -quit) ;;
            *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac

          [ -n "$app" ] || { echo "::error::could not find the unpacked app executable"; exit 1; }
          echo "Launching $app"

          # Chromium's setuid sandbox aborts unless its helper is root-owned and
          # setuid; the installers do this at install time, so do it here
          # rather than pass --no-sandbox.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sandbox="$(dirname "$app")/chrome-sandbox"
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi

          launch() { if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$@"; else "$@"; fi; }

          # Smoke waits for renderer readiness and a resolved companion outcome.
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          ABACUSAI_BOT_HOME="$scratch/home" ABACUSAI_BOT_SMOKE_TEST=1 launch "$app" > app.log 2>&1 &
          pid=$!
          for _ in $(seq 1 110); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            echo "::error::packaged smoke exceeded its readiness bound"
            cat app.log
            exit 1
          fi
          wait "$pid"
          cat app.log
          grep -qF '[smoke] main process ready' app.log
          grep -qF '[smoke] renderer ready' app.log
          grep -qE '\[smoke\] notch (ready|n/a|disabled: (probe failed|no internal display|no cut-out|off by pref))$' app.log

          # The marker says the ready chain finished; this checks nothing blew
          # up on the way.
          if grep -qiE 'ReferenceError|TypeError|SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find (package|module)|Uncaught Exception|A JavaScript error occurred|threw an error|unhandled (promise )?rejection' app.log; then
            echo "::error::the main process logged a fatal error on startup"
            exit 1
          fi
