name: CodeQL

# Static analysis for the class of bug a reviewer is worst at spotting by eye:
# injection into a spawned command, a path built from untrusted input, a regex
# that catastrophically backtracks. This app spawns processes, opens sockets,
# and bridges IPC across a privilege boundary, which is exactly the surface
# CodeQL's javascript-typescript pack covers.
#
# No build step: CodeQL reads JS/TS source directly, so this never pays for
# the Electron toolchain and cannot break when the build does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the query pack itself updates — a scan that only runs on
    # pushes stops finding new bug classes the moment the repo goes quiet.
    - cron: "30 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Code scanning needs GitHub Code Security, which is a paid add-on while
    # this repo is private and free the moment it is public. Gated rather than
    # deleted for the same reason npm provenance is (see npm-publish.yml): it
    # switches itself on with no change here when the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # The analyze step reads its own workflow-run metadata; without this the
      # upload fails with "Resource not accessible by integration".
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"
