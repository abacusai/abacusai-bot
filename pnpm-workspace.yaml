packages:
  - apps/*
  - packages/agent
  - packages/contract
  - packages/config
  - packages/connectors
  - packages/test-support

pmOnFail: warn

catalog:
  "@types/node": ^26.2.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": 6.1.1
  "@vitest/coverage-v8": ^4.1.11
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  turbo: ^2.10.11
  react: ^19.3.0
  react-dom: ^19.3.0
  tsdown: ^0.22.14
  typescript: ^7.0.2
  ultracite: ^7.10.5
  vite: ^8.2.1
  vitest: ^4.1.11

# Electron and the native addons resolve their own binaries by walking up from
# wherever they are linked, which a symlinked store breaks.
nodeLinker: hoisted

allowBuilds:
  "@ast-grep/lang-python": true
  "@tailwindcss/oxide": true
  "@google/genai": false
  electron: true
  electron-winstaller: false
  protobufjs: false
  # esbuild only verifies its platform binary on install.
  esbuild: true
  zigpty: set this to true or false

# dompurify below 3.4.13 carries known XSS bypasses and arrives transitively
# through the markdown pipeline. deepmerge-ts below 8 breaks CJS/ESM interop.
# fast-uri below 3.1.7 (via electron-store > conf > ajv, and the MCP SDK) has six
# high SSRF / host-confusion advisories (GHSA-5jgf-p345-68v8, GHSA-qw65-cvwx-89v3
# and siblings).
overrides:
  # Patched releases for the October 2026 dependency audit.
  seroval: ^1.6.1
  source-map-js: ^1.2.2
  proxy-addr: ^2.0.8
  tinypool: ^2.1.2
  "@modelcontextprotocol/sdk": ^1.31.0
  # Keep each dependency on its existing major while fixing the October 2026
  # HTTP-parser and brace-expansion denial-of-service advisories.
  "undici@^6": ^6.28.1
  "undici@^7": ^7.29.1
  "undici@^8": ^8.10.2
  "brace-expansion@^1": ^1.1.21
  "brace-expansion@^2": ^2.1.7
  "brace-expansion@^5": ^5.0.12
  # electron-builder download cache: fixes GHSA-ch52-4w7c-c8xp.
  http-cache-semantics: ^4.3.0
  dompurify: ^3.4.13
  deepmerge-ts: ^8.0.0
  fast-uri: ^3.1.7
  # Packaging only, through electron-builder's plist reader: injection and
  # quadratic-parsing advisories against 0.8.x (GHSA-c7q8-3ch8-vqpv and five
  # siblings).
  "@xmldom/xmldom": ^0.8.15
  # electron-updater's feed parser: GHSA-2883-xcg3-v3hh, unbounded CPU on
  # empty merge sources.
  js-yaml: ^4.3.2
  # undici arrives three times over (jsdom under vitest, @electron/get, node-gyp
  # under electron-builder), each major on a release with WebSocket DoS, TLS
  # option-drop and cache-poisoning advisories (GHSA-rfgv-xxqx-mfg5,
  # GHSA-w293-vg96-wgc3, GHSA-vp8m-p9jh-q5pm).
  "undici@6": ^6.28.1
  "undici@7": ^7.29.1
  "undici@8": ^8.10.2
  # minimatch's brace expander, packaging and test tooling only: stack
  # exhaustion on nested groups (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p).
  "brace-expansion@1": ^1.1.21
  "brace-expansion@2": ^2.1.7
  "brace-expansion@5": ^5.0.12
  # transformers.js runs Whisper in the renderer on onnxruntime-web; its Node
  # backend and image codec would only add native binaries the app never loads.
  onnxruntime-node: "-"
  sharp: "-"

minimumReleaseAgeExclude:
  # Pinned exact in apps/desktop, so the age gate could only block that one
  # pinned install. Every bump is already an individual, human-reviewed PR.
  - electron@44.4.5
  # Younger than the age window when #217 pinned it; the exclusion names the
  # exact version, so it lapses on its own at the next bump.
  - typebox@1.3.16
  - framer-motion@13.4.6
  - lucide-react@1.49.0
  - motion@13.4.6
  - http-cache-semantics@4.3.0

patchedDependencies:
  ghostty-web@0.4.0: patches/ghostty-web@0.4.0.patch
